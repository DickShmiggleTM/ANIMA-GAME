# PPO hyperparameters — Stage 0 (survival basics: hunger + thirst)
policy: MlpPolicy
curriculum_stage: 0
timesteps: 500000
n_envs: 8
max_steps_per_episode: 3000

policy_kwargs:
  net_arch: [128, 128]

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

eval:
  eval_freq: 25000
  n_eval_episodes: 10
  deterministic: true
